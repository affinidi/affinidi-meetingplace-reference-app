name: meetingplace_flutter_reference_app_workspace
publish_to: "none"

workspace:
  - app
  - packages/app-core

environment:
  sdk: ">=3.12.0 <4.0.0"

dev_dependencies:
  coverage: ^1.11.1
  dart_flutter_team_lints: ^3.2.1
  melos: ^7.1.1

dependency_overrides:
  ffi: 2.2.0
  json_annotation: ^4.8.0
  meeting_place_chat:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: f9e382b41e49dd732659ec46ae90aa4937619854
      path: packages/meeting_place_chat
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_chat
  meeting_place_control_plane:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: f9e382b41e49dd732659ec46ae90aa4937619854
      path: packages/meeting_place_control_plane
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_control_plane
  meeting_place_core:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: f9e382b41e49dd732659ec46ae90aa4937619854
      path: packages/meeting_place_core
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_core
  meeting_place_credentials:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: f9e382b41e49dd732659ec46ae90aa4937619854
      path: packages/meeting_place_credentials
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_credentials
  meeting_place_drift_repository:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: f9e382b41e49dd732659ec46ae90aa4937619854
      path: packages/meeting_place_drift_repository
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_drift_repository
  meeting_place_mediator:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: f9e382b41e49dd732659ec46ae90aa4937619854
      path: packages/meeting_place_mediator
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_mediator
  meeting_place_personal_agent:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: chore/cierge-integration
      path: packages/meeting_place_personal_agent
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_personal_agent
  meeting_place_vta_client:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      ref: chore/cierge-integration
      path: packages/meeting_place_vta_client
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/vta-client-sdk/packages/meeting_place_vta_client
  meta: ^1.18.2
  test_api: ^0.7.12
  
melos:
  scripts:
    analyze:
      run: melos run _analyze --no-select
    _analyze:
      exec: dart analyze --fatal-infos .
      concurrency: 4
      failFast: true
      packageFilters:
        scope:
          - mpx_app_core
          - mpx_flutter_reference_app

    test:
      run: |
        melos run test-flutter

    test-flutter:
      description: Run tests in each flutter package
      exec: flutter test --coverage
      dirExists: test
      concurrency: 4
      failFast: true
      noSelect: true
      packageFilters:
        flutter: true
        includePrivatePackages: true
        #diff: 'origin/main'
        ignore:
          - "*_example*"

    coverage-html:
      run: dart run melos exec -- "genhtml coverage/lcov.info --output-directory=coverage/html"
      packageFilters:
        scope:
          - mpx_flutter_reference_app
      description: Generate HTML coverage report for app

    pubget:
      run: flutter pub get
      exec:
        concurrency: 5
        orderDependents: true
      description: Get dependencies for all workspace packages

    ios-deps:
      run: |
        melos exec --scope=mpx_flutter_reference_app -- flutter precache --ios
        melos exec --scope=mpx_flutter_reference_app -- "cd ios; pod install --repo-update"

    gen:
      run: |
        echo "------------------------------------------------------------------------"
        echo "Generating code"
        echo "------------------------------------------------------------------------"
        melos exec --scope=mpx_flutter_reference_app -- flutter clean
        melos exec --scope=mpx_flutter_reference_app -- dart run build_runner build
        melos exec --scope=mpx_flutter_reference_app -- dart format -l 80 lib test

    strings:
      run: |
        echo "------------------------------------------------------------------------"
        echo "Generating localized strings"
        echo "------------------------------------------------------------------------"
        melos exec --scope=mpx_flutter_reference_app -- flutter gen-l10n
        melos exec --scope=mpx_flutter_reference_app -- dart format -l 80 lib test

