name: meetingplace_flutter_reference_app_workspace
publish_to: "none"

workspace:
  - app
  - packages/app-core

environment:
  sdk: ">=3.12.0 <4.0.0"

dev_dependencies:
  coverage: ^1.11.1
  dart_flutter_team_lints: ^3.2.1
  melos: ^7.1.1

dependency_overrides:
  ffi: 2.2.0
  # TODO (earl): remove once meeting_place_matrix_livekit is published to pub.dev and
  # the git override below is no longer needed. The git-pinned livekit_client
  # transitively requires device_info_plus ^12.3.0 → win32 ^5.x, which
  # conflicts with file_picker ^12.x requiring win32 ^6.x.
  # flutter_secure_storage_windows 4.1.0 also requires win32 ^5.x.
  device_info_plus: ^13.0.0
  win32: ^6.2.0
  flutter_secure_storage_windows: ^4.2.2

  meeting_place_chat:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      path: packages/meeting_place_chat
      ref: af30b0cee49296f1d4328651004f358aef789550
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/matrix-livekit-plugin-rebase/packages/meeting_place_chat
  meeting_place_control_plane:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      path: packages/meeting_place_control_plane
      ref: af30b0cee49296f1d4328651004f358aef789550
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/matrix-livekit-plugin-rebase/packages/meeting_place_control_plane
  meeting_place_core:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      path: packages/meeting_place_core
      ref: af30b0cee49296f1d4328651004f358aef789550
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/matrix-livekit-plugin-rebase/packages/meeting_place_core
  meeting_place_drift_repository:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      path: packages/meeting_place_drift_repository
      ref: af30b0cee49296f1d4328651004f358aef789550
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/matrix-livekit-plugin-rebase/packages/meeting_place_drift_repository
  meeting_place_matrix_livekit:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      path: packages/meeting_place_matrix_livekit
      ref: af30b0cee49296f1d4328651004f358aef789550
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/matrix-livekit-plugin-rebase/packages/meeting_place_matrix_livekit
  meeting_place_mediator:
    git:
      url: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
      path: packages/meeting_place_mediator
      ref: af30b0cee49296f1d4328651004f358aef789550
    # path: ../../../../affinidi-meetingplace-sdk-dart/worktrees/feat/matrix-livekit-plugin-rebase/packages/meeting_place_mediator
  meta: ^1.18.2
  test_api: ^0.7.12

melos:
  scripts:
    analyze:
      run: melos run _analyze --no-select
    _analyze:
      exec: dart analyze --fatal-infos .
      concurrency: 4
      failFast: true
      packageFilters:
        scope:
          - mpx_app_core
          - mpx_flutter_reference_app

    test:
      run: |
        melos run test-flutter

    test-flutter:
      description: Run tests in each flutter package
      exec: flutter test --coverage
      dirExists: test
      concurrency: 4
      failFast: true
      noSelect: true
      packageFilters:
        flutter: true
        includePrivatePackages: true
        #diff: 'origin/main'
        ignore:
          - "*_example*"

    coverage-html:
      run: dart run melos exec -- "genhtml coverage/lcov.info --output-directory=coverage/html"
      packageFilters:
        scope:
          - mpx_flutter_reference_app
      description: Generate HTML coverage report for app

    pubget:
      run: flutter pub get
      exec:
        concurrency: 5
        orderDependents: true
      description: Get dependencies for all workspace packages

    ios-deps:
      run: |
        melos exec --scope=mpx_flutter_reference_app -- flutter precache --ios
        melos exec --scope=mpx_flutter_reference_app -- "cd ios; pod install --repo-update"

    gen:
      run: |
        echo "------------------------------------------------------------------------"
        echo "Generating code"
        echo "------------------------------------------------------------------------"
        melos exec --scope=mpx_flutter_reference_app -- flutter clean
        melos exec --scope=mpx_flutter_reference_app -- dart run build_runner build --delete-conflicting-outputs
        melos exec --scope=mpx_flutter_reference_app -- dart format -l 80 lib test

    strings:
      run: |
        echo "------------------------------------------------------------------------"
        echo "Generating localized strings"
        echo "------------------------------------------------------------------------"
        melos exec --scope=mpx_flutter_reference_app -- flutter gen-l10n
        melos exec --scope=mpx_flutter_reference_app -- dart format -l 80 lib test

