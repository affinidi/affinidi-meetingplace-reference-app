# NOTE: Remove this workflow once all SDK packages are published to pub.dev
# with matching functionality and git overrides in pubspec.yaml are removed.

name: Validate Git Dependencies

on:
  pull_request:
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/validate-git-dependencies.yaml'
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'

jobs:
  validate-git-sha:
    name: Validate Git Dependency SHA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate git dependency SHA
        env:
          EXPECTED_SHA: "986b44c1d56fe6ea2a47ea6e5db03713714b1916"
        run: |
          PACKAGES="meeting_place_chat meeting_place_control_plane meeting_place_core meeting_place_drift_repository meeting_place_matrix_livekit meeting_place_mediator"
          
          for pkg in $PACKAGES; do
            CURRENT_SHA=$(grep -A 5 "$pkg:" pubspec.yaml | grep "ref:" | sed 's/.*ref: *//' | tr -d ' ')
            
            if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::Git SHA mismatch for $pkg"
              echo "::error::Expected: $EXPECTED_SHA"
              echo "::error::Found: $CURRENT_SHA"
              echo ""
              echo "SECURITY: Git dependency SHA has changed."
              echo "If intentional, update EXPECTED_SHA in this workflow and document the change."
              echo "Repository: https://github.com/affinidi/affinidi-meetingplace-sdk-dart"
              exit 1
            fi
          done
