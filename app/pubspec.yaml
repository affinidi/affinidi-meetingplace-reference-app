name: mpx_flutter_reference_app
description: "Affinidi Meeting Place - open-source reference implementation of a chat application based on DIDComm v2.1 messaging protocol"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

resolution: workspace

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.7+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  app_badge_plus: ^1.2.3
  camera: ^0.11.2
  circom_witnesscalc: ^0.0.1-beta.1
  clear_all_notifications: ^1.0.0
  clock: any
  collection: ^1.19.1
  confetti: ^0.8.0
  connectivity_plus: ^7.0.0
  copy_with_extension: any
  cross_file: ^0.3.5
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  drift: ^2.33.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_card_swiper: ^7.0.2
  flutter_hooks: ^0.21.2
  flutter_hsvcolor_picker: ^1.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_rapidsnark: ^0.0.1-beta.7
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.9
  form_field_validator: ^1.1.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  go_router_builder: ^4.3.0
  hooks_riverpod: ^3.3.1
  image: ^4.5.4
  image_picker: ^1.2.0
  intl: any
  intl_phone_number_input: ^0.7.5
  local_auth: ^2.3.0
  meeting_place_chat: ^0.0.1-dev.43
  meeting_place_control_plane: ^0.0.1-dev.19
  meeting_place_core: ^0.0.1-dev.40
  meeting_place_credentials: ^0.0.1-dev.3
  meeting_place_drift_repository: ^0.0.1-dev.44
  mobile_scanner: ^7.1.3
  mpx_app_core:
    path: ../packages/app-core
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pie_menu: ^3.3.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^1.2.1
  sqlite3: ^3.0.0
  ssi: ^3.3.0
  stack_trace: ^1.12.1
  synchronized: ^3.4.0
  uuid: ^4.5.1
  vc_zkp: ^1.2.5
  video_player: ^2.10.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependency_overrides:
  meta: ^1.18.2

dev_dependencies:
  build_runner: ^2.4.8
  copy_with_extension_gen: any
  dart_flutter_team_lints: ^3.5.2
  drift_dev: ^2.33.0
  file: ^7.0.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.4-dev.3

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - assets/zkp/

